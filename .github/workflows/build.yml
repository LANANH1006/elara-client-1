name: Build Elara Client

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Tìm thư mục chứa build.gradle
        run: |
          DIR=$(dirname "$(find . -name build.gradle -not -path '*/build/*' | head -n 1)")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Tạo Gradle wrapper 8.12
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle wrapper --gradle-version 8.12

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Chỉ giữ đúng một file .jar đã remap
        working-directory: ${{ env.PROJECT_DIR }}/build/libs
        run: |
          # Bỏ jar phụ nếu Loom hoặc Gradle có tạo (-dev, -sources, -obf)
          rm -f ./*-dev.jar ./*-sources.jar ./*-obf.jar
          echo "File còn lại trong build/libs:"
          ls -la
          COUNT=$(ls ./*.jar 2>/dev/null | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "Cần đúng 1 file .jar nhưng có $COUNT"
            exit 1
          fi
          echo "Jar phát hành: $(ls ./*.jar)"

      - uses: actions/upload-artifact@v4
        with:
          name: elara-client
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
