buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // ProGuard: làm khó đọc code (obfuscate) bản jar phát hành
        classpath 'com.guardsquare:proguard-gradle:7.5.0'
    }
}

plugins {
    id 'fabric-loom'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Bộ giải mã mp3 và ogg cho trình phát nhạc, đóng gói sẵn trong jar (jar-in-jar)
    include "com.googlecode.soundlibs:mp3spi:1.9.5.4"
    include "com.googlecode.soundlibs:vorbisspi:1.0.3.3"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Obfuscate jar sau khi remapJar. File phát hành là ...-obf.jar.
// Bỏ qua bước này khi cần: ./gradlew build -x obfuscate
tasks.register('obfuscate', proguard.gradle.ProGuardTask) {
    dependsOn 'remapJar'
    injars tasks.named('remapJar').get().archiveFile.get().asFile
    outjars layout.buildDirectory.file("libs/${project.archives_base_name}-${project.version}-obf.jar").get().asFile
    configuration 'proguard-rules.pro'
}

tasks.named('build') {
    dependsOn 'obfuscate'
}
